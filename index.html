
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mi Día" />
  <meta name="theme-color" content="#0a0a14" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />
  <title>Mi Día</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a14; }
    @keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.4} }
    body {
      font-family: 'Space Mono', monospace; color: #e8e4dc; min-height: 100vh;
      background: radial-gradient(ellipse at 20% 20%, #1a1035 0%, #0a0a14 50%, #0d1a1a 100%);
      display: flex; flex-direction: column; align-items: center; padding: 36px 16px 80px;
    }
    #app { width: 100%; max-width: 580px; display: flex; flex-direction: column; gap: 18px; }
    #sync-dot { width:7px;height:7px;border-radius:50%;background:#00b894;display:inline-block;margin-left:8px;vertical-align:middle;transition:background .3s }
    #sync-dot.syncing { background:#ffb844;animation:pulse 1s infinite }
    #sync-dot.offline { background:#ff4d4d }
    #header { display:flex;justify-content:space-between;align-items:flex-start }
    h1 { font-family:'Fraunces',serif;font-size:42px;font-weight:300;letter-spacing:-1px;line-height:1 }
    h1 span { color:#6c5ce7 }
    #progress-box { text-align:right }
    #pct { font-size:28px;font-weight:700;color:#6c5ce7;line-height:1 }
    #pct-label { font-size:10px;color:#ffffff35;letter-spacing:2px;margin-top:4px }
    #progress-bar-wrap { height:3px;background:#ffffff10;border-radius:2px;overflow:hidden;margin-top:8px }
    #progress-bar { height:100%;background:linear-gradient(90deg,#6c5ce7,#00b894);border-radius:2px;transition:width .5s;width:0% }
    /* Calendar */
    #cal-wrap { background:#ffffff06;border:1px solid #ffffff10;border-radius:16px;padding:16px }
    #cal-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:14px }
    #cal-title { font-size:13px;color:#ffffff80;letter-spacing:2px;text-transform:uppercase }
    .cal-nav { width:28px;height:28px;border-radius:8px;border:1px solid #ffffff15;background:transparent;color:#ffffff50;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s }
    .cal-nav:hover { border-color:#6c5ce755;color:#fff }
    #cal-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:2px }
    .cal-dname { font-size:9px;color:#ffffff25;text-transform:uppercase;letter-spacing:1px;text-align:center;padding:2px 0 6px }
    .cal-cell { aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:12px;color:#ffffff40;transition:all .2s;position:relative;padding:2px }
    .cal-cell:hover { background:#ffffff0a;color:#ffffff80 }
    .cal-cell.today { color:#00b894;font-weight:700 }
    .cal-cell.selected { background:#6c5ce7;color:#fff !important }
    .cal-cell.other-month { opacity:.25 }
    .cal-dot { width:4px;height:4px;border-radius:50%;margin-top:2px;flex-shrink:0 }
    /* Week nav */
    #week-wrap { display:flex;align-items:center;gap:8px }
    .nav-arrow { flex-shrink:0;width:36px;height:36px;border-radius:10px;border:1px solid #ffffff15;background:transparent;color:#ffffff50;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s }
    .nav-arrow:hover { border-color:#6c5ce755;color:#fff }
    .nav-arrow:disabled { opacity:.25;cursor:default }
    #week-nav { flex:1;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none }
    #week-nav::-webkit-scrollbar { display:none }
    .day-btn { flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:7px 9px;border-radius:12px;border:1px solid #ffffff15;background:transparent;color:#ffffff40;cursor:pointer;font-family:'Space Mono',monospace;transition:all .2s;min-width:46px }
    .day-btn .dname { font-size:9px;text-transform:uppercase;letter-spacing:1px }
    .day-btn .dnum  { font-size:16px;font-weight:700;margin-top:2px }
    .day-btn .dmes  { font-size:9px;color:#ffffff30;letter-spacing:1px;margin-top:1px }
    .day-btn.active { background:#6c5ce7;border-color:#6c5ce7;color:#fff }
    .day-btn.active .dmes { color:#ffffff80 }
    .day-btn.has-tasks { border-color:#6c5ce755;color:#ffffff80 }
    .day-btn.today .dnum { color:#00b894 }
    /* IA bubble */
    #ia-bubble { background:#ffffff08;border:1px solid #ffffff12;border-radius:16px;padding:16px 20px;display:flex;gap:12px;align-items:flex-start }
    #ia-avatar { width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#00b894);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0 }
    #ia-label { font-size:10px;color:#6c5ce7;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px }
    #ia-text { font-family:'Fraunces',serif;font-size:15px;color:#c8c4bc;line-height:1.6 }
    /* GCal */
    #gcal-bar { background:#ffffff06;border:1px solid #ffffff10;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px }
    #gcal-bar .gcal-icon { font-size:18px;flex-shrink:0 }
    #gcal-bar .gcal-info { flex:1 }
    #gcal-bar .gcal-title { font-size:11px;color:#ffffff60;letter-spacing:1px;text-transform:uppercase }
    #gcal-bar .gcal-user { font-size:12px;color:#00b894;margin-top:2px;font-family:'Fraunces',serif }
    #gcal-btns { display:flex;gap:6px;flex-shrink:0 }
    #gcal-connect { background:linear-gradient(135deg,#4285f4,#34a853);border:none;border-radius:10px;color:#fff;font-family:'Space Mono',monospace;font-size:11px;padding:8px 14px;cursor:pointer;white-space:nowrap }
    #gcal-sync-all { display:none;background:#6c5ce720;border:1px solid #6c5ce755;border-radius:10px;color:#a29bfe;font-family:'Space Mono',monospace;font-size:10px;padding:6px 10px;cursor:pointer;white-space:nowrap }
    /* Remedio */
    #remedio-btn { width:100%;padding:12px;border-radius:14px;border:1px dashed #a29bfe55;background:#a29bfe10;color:#a29bfe;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px }
    #remedio-btn:hover { background:#a29bfe20;border-color:#a29bfe }
    /* Input */
    #input-wrap { background:#ffffff06;border:1px solid #ffffff15;border-radius:16px;padding:4px 4px 4px 16px;display:flex;align-items:flex-end;gap:8px }
    textarea { flex:1;background:transparent;border:none;outline:none;resize:none;color:#e8e4dc;font-family:'Fraunces',serif;font-size:14px;line-height:1.6;padding:12px 0 }
    textarea::placeholder { color:#ffffff30 }
    #send-btn { width:44px;height:44px;border-radius:12px;border:none;background:linear-gradient(135deg,#6c5ce7,#00b894);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s }
    #send-btn:disabled { opacity:.3;cursor:default }
    /* Tasks */
    #tasks-header { display:flex;justify-content:space-between;align-items:center }
    #tasks-count { font-size:10px;color:#ffffff30;letter-spacing:2px;text-transform:uppercase }
    #clear-btn { background:transparent;border:none;color:#ffffff25;cursor:pointer;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-family:'Space Mono',monospace }
    #clear-btn:hover { color:#ff4d4d80 }
    #empty { text-align:center;padding:48px 0;color:#ffffff20 }
    #empty .icon { font-size:32px;margin-bottom:12px }
    #empty p { font-family:'Fraunces',serif;font-size:16px }
    #empty small { font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:6px;display:block }
    #task-list { display:flex;flex-direction:column;gap:10px }
    .task-card { border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;transition:opacity .3s;animation:slideIn .35s cubic-bezier(.34,1.56,.64,1);position:relative }
    .task-card.done { opacity:.4 }
    .task-check { width:20px;height:20px;border-radius:50%;border:2px solid;background:transparent;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#0a0a14;transition:all .2s }
    .task-info { flex:1;min-width:0 }
    .task-meta { display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap }
    .task-hora { font-size:11px;letter-spacing:1px }
    .task-prio { font-size:10px;color:#ffffff25;text-transform:uppercase;letter-spacing:1px }
    .task-recurrent { font-size:10px;color:#00b89480;letter-spacing:1px }
    .task-texto { font-family:'Fraunces',serif;font-size:15px;color:#e8e4dc;line-height:1.4 }
    .task-card.done .task-texto { text-decoration:line-through;color:#ffffff30 }
    .task-actions { display:flex;gap:4px;flex-shrink:0;position:relative;align-items:center }
    .task-btn { background:transparent;border:none;color:#ffffff20;cursor:pointer;font-size:13px;padding:2px 5px;transition:color .2s }
    .task-btn:hover { color:#ffffff80 }
    .task-btn.del:hover { color:#ff4d4d80 }
    .cal-tag { font-size:10px;color:#00b89440 }
    /* Delete menu */
    .del-menu { position:absolute;right:0;top:28px;background:#1a1a2e;border:1px solid #ffffff20;border-radius:10px;overflow:hidden;z-index:50;min-width:160px;box-shadow:0 8px 24px #00000060;animation:fadeIn .15s ease }
    .del-menu button { display:block;width:100%;padding:10px 14px;background:transparent;border:none;color:#e8e4dc;font-family:'Space Mono',monospace;font-size:11px;text-align:left;cursor:pointer;transition:background .15s }
    .del-menu button:hover { background:#ffffff10 }
    .del-menu button.danger { color:#ff4d4d }
    .del-menu button.danger:hover { background:#ff4d4d15 }
    .del-menu .del-sep { height:1px;background:#ffffff10 }
    /* Modal */
    .modal-overlay { display:none;position:fixed;inset:0;background:#0a0a14cc;backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;padding:20px }
    .modal-overlay.open { display:flex;animation:fadeIn .2s }
    .modal-box { background:#12121f;border:1px solid #ffffff15;border-radius:20px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto }
    .modal-box h2 { font-family:'Fraunces',serif;font-weight:300;font-size:22px;margin-bottom:20px }
    .field { margin-bottom:14px }
    .field label { font-size:10px;color:#ffffff40;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:6px }
    .field input, .field select { width:100%;background:#ffffff08;border:1px solid #ffffff15;border-radius:10px;padding:10px 14px;color:#e8e4dc;font-family:'Space Mono',monospace;font-size:13px;outline:none }
    .field input:focus, .field select:focus { border-color:#6c5ce755 }
    .field select option { background:#12121f }
    .day-chips { display:flex;gap:6px;flex-wrap:wrap;margin-top:6px }
    .day-chip { padding:5px 10px;border-radius:8px;border:1px solid #ffffff20;background:transparent;color:#ffffff50;font-size:11px;font-family:'Space Mono',monospace;cursor:pointer;transition:all .2s }
    .day-chip.sel { background:#6c5ce7;border-color:#6c5ce7;color:#fff }
    .modal-btns { display:flex;gap:10px;margin-top:20px }
    .btn-cancel { flex:1;padding:12px;border-radius:12px;border:1px solid #ffffff15;background:transparent;color:#ffffff60;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer }
    .btn-save { flex:2;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#6c5ce7,#00b894);color:#fff;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer }
    /* Remedio modal */
    .rem-preview { background:#a29bfe10;border:1px solid #a29bfe25;border-radius:10px;padding:12px;margin-bottom:16px;font-size:11px;color:#a29bfe;line-height:1.8;min-height:40px }
    /* Toast */
    #toast { position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid #ffffff20;border-radius:12px;padding:12px 20px;font-size:12px;color:#e8e4dc;display:none;z-index:999;white-space:nowrap;animation:fadeIn .3s ease }
    #toast.ok  { border-color:#00b89455;color:#00b894 }
    #toast.err { border-color:#ff4d4d55;color:#ff4d4d }
    #footer { text-align:center;font-size:10px;color:#ffffff12;letter-spacing:2px;text-transform:uppercase;margin-top:8px }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div>
    <div id="header">
      <div>
        <div id="date-label" style="font-size:11px;color:#ffffff35;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px"></div>
        <h1>Mi Día<span> _</span><span id="sync-dot"></span></h1>
      </div>
      <div id="progress-box" style="display:none">
        <div id="pct">0%</div>
        <div id="pct-label">0/0 listas</div>
      </div>
    </div>
    <div id="progress-bar-wrap" style="margin-top:10px;display:none"><div id="progress-bar"></div></div>
  </div>

  <!-- Calendario -->
  <div id="cal-wrap">
    <div id="cal-header">
      <button class="cal-nav" id="cal-prev">‹</button>
      <div id="cal-title"></div>
      <button class="cal-nav" id="cal-next">›</button>
    </div>
    <div id="cal-grid"></div>
  </div>

  <!-- Semana -->
  <div id="week-wrap">

    <button class="nav-arrow" id="week-next">›</button>

    <div class="gcal-info">

    </div>
    <div id="gcal-btns">
      <button id="gcal-sync-all">Sincronizar todo</button>
      <button id="gcal-connect">Conectar</button>
    </div>
  </div>

  <!-- IA -->
  <div id="ia-bubble">
    <div id="ia-avatar">◈</div>
    <div>

  <div id="tasks-section" style="display:none">
    <div id="tasks-header">

      <button id="clear-btn">Limpiar día</button>
    </div>
  </div>
  <div id="empty"><div class="icon">◈</div><p>Tu día está en blanco.</p><small>Contale qué tenés planeado</small></div>
  <div id="task-list"></div>
  <div id="footer">Mi Día IA · v4.0</div>
</div>

<!-- Modal editar -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <h2>Editar tarea</h2>
    <div class="field"><label>Descripción</label><input type="text" id="edit-texto" /></div>
    <div class="field"><label>Hora</label><input type="time" id="edit-hora" /></div>
    <div class="field"><label>Prioridad</label>
      <select id="edit-prio"><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select>
    </div>
    <div class="field"><label>Tipo</label>
      <select id="edit-tipo"><option value="tarea">Tarea</option><option value="evento">Evento</option><option value="recordatorio">Recordatorio</option></select>
    </div>
    <div class="field"><label>Repetir</label>
      <div class="day-chips" id="edit-days">
        <button class="day-chip" data-d="1">Lun</button>
        <button class="day-chip" data-d="2">Mar</button>
        <button class="day-chip" data-d="3">Mié</button>
        <button class="day-chip" data-d="4">Jue</button>
        <button class="day-chip" data-d="5">Vie</button>
        <button class="day-chip" data-d="6">Sáb</button>
        <button class="day-chip" data-d="0">Dom</button>
      </div>
    </div>
    <div class="field" id="until-field" style="display:none"><label>Repetir hasta</label>
      <select id="edit-until">
        <option value="4">4 semanas</option>

    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="edit-cancel">Cancelar</button>
      <button class="btn-save" id="edit-save">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal remedio -->
<div class="modal-overlay" id="rem-modal">
  <div class="modal-box">
    <h2 style="color:#a29bfe">💊 Recordatorio de remedio</h2>
    <div class="field"><label>Nombre</label><input type="text" id="rem-nombre" placeholder="Ej: Ibuprofeno 400mg" /></div>
    <div class="field"><label>Primera toma</label><input type="time" id="rem-hora" /></div>
    <div class="field"><label>Cada cuántas horas</label>
      <select id="rem-cada">
        <option value="4">Cada 4 horas</option>
        <option value="6">Cada 6 horas</option>
        <option value="8" selected>Cada 8 horas</option>
        <option value="12">Cada 12 horas</option>
        <option value="24">Una vez por día</option>
      </select>
    </div>
    <div class="field"><label>Por cuántos días</label>
      <select id="rem-dias">
        <option value="1">1 día</option>
        <option value="2">2 días</option>
        <option value="3">3 días</option>
        <option value="5" selected>5 días</option>
        <option value="7">7 días</option>
        <option value="10">10 días</option>
      </select>
    </div>
    <div class="rem-preview" id="rem-preview">Completá los campos para ver los horarios</div>
    <div class="modal-btns">
      <button class="btn-cancel" id="rem-cancel">Cancelar</button>
      <button class="btn-save" id="rem-save" style="background:linear-gradient(135deg,#a29bfe,#6c5ce7)">Agregar recordatorios</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, updateDoc }

const GCAL_CLIENT_ID = '293982751859-5udrcb7dd44j45qpl7ks15ailleocc3v.apps.googleusercontent.com';

// ── Firebase ──────────────────────────────────────────────────────────────────
const db  = getFirestore(initializeApp(FB));

// ── State ─────────────────────────────────────────────────────────────────────
let allTareas    = [];

// ── Utils ─────────────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateFromStr(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function strFromDate(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function isCompletedOn(t, ds) {
  if (t.recurrentDays && t.recurrentDays.length) return !!(t.completedDates && t.completedDates[ds]);
  return !!t.completada;
}

function tareasDelDia(ds) {
  const dow = dateFromStr(ds).getDay();
  return allTareas.filter(t => {
    if (t.skippedDates && t.skippedDates[ds]) return false;
    if (t.recurrentDays && t.recurrentDays.length) {
      if (!t.recurrentDays.includes(dow)) return false;
      if (t.recurrentUntil && ds > t.recurrentUntil) return false;
      return true;
    }
    return t.fecha === ds;
  });
}

function getCardColors(tipo, prio) {
  const p = PRIO_COLOR[prio] || PRIO_COLOR.media;
  const b = TIPO_BASE[tipo];
  if (!b) return { bg:p+'22', border:p+'55', dot:p, stripe:null };
  return { bg:b+'18', border:b+'50', dot:p, stripe:b };
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = type||'ok'; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(()=>t.style.display='none', 3500);
}

function setSyncState(s) {
  const d = document.getElementById('sync-dot');
  d.className = s === 'ok' ? '' : s;
}

// ── Firebase ops ──────────────────────────────────────────────────────────────
async function saveTask(t) {
  setSyncState('syncing');
  await setDoc(doc(db,"tareas",t.id), t);
  setSyncState('ok');
  if (gcalUser && gcalToken) syncToGCal(t, t.fecha||selectedDate).catch(()=>{});
}

async function removeTask(id) {
  // Delete from Firebase first (non-blocking on GCal)
  setSyncState('syncing');
  await deleteDoc(doc(db,"tareas",id));
  setSyncState('ok');
  // Try GCal delete in background
  const t = allTareas.find(x=>x.id===id);
  if (t && gcalUser && gcalToken && t.gcalEventId) {
    for (const eid of Object.values(t.gcalEventId)) {
      try { await gcalReq('DELETE','/calendars/primary/events/'+eid); } catch(e) {}
    }
  }
}

async function patchTask(id, data) {
  setSyncState('syncing');
  await updateDoc(doc(db,"tareas",id), data);
  setSyncState('ok');
}

// ── Firebase listener ─────────────────────────────────────────────────────────
setSyncState('syncing');
onSnapshot(COL, snap => {
  allTareas = snap.docs.map(d=>({id:d.id,...d.data()}));
  setSyncState('ok');
  document.getElementById('ia-text').textContent = '¡Hola! Contame qué tenés para hoy 📋';
  document.getElementById('send-btn').disabled = !document.getElementById('input').value.trim();
  buildCalendar(); buildWeek(); renderTasks(); updateHeader();
}, ()=>{ setSyncState('offline'); document.getElementById('ia-text').textContent='Sin conexión 📡'; });

// ── Header ────────────────────────────────────────────────────────────────────
function updateHeader() {
  const d = dateFromStr(selectedDate);
  const isToday = selectedDate===todayStr();
  document.getElementById('date-label').textContent = isToday
    ? 'hoy · '+DIASL[d.getDay()]+', '+d.getDate()+' de '+MESESL[d.getMonth()]
    : DIASL[d.getDay()]+', '+d.getDate()+' de '+MESESL[d.getMonth()];
  const tareas=tareasDelDia(selectedDate), total=tareas.length;
  const done=tareas.filter(t=>isCompletedOn(t,selectedDate)).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progress-box').style.display=total?'block':'none';
  document.getElementById('progress-bar-wrap').style.display=total?'block':'none';
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('pct-label').textContent=done+'/'+total+' listas';
  document.getElementById('progress-bar').style.width=pct+'%';
}

// ── Calendar ──────────────────────────────────────────────────────────────────
function buildCalendar() {
  const yr=calMonth.getFullYear(), mo=calMonth.getMonth();
  document.getElementById('cal-title').textContent=MESESL[mo].charAt(0).toUpperCase()+MESESL[mo].slice(1)+' '+yr;
  const grid=document.getElementById('cal-grid'); grid.innerHTML='';
  ['D','L','M','M','J','V','S'].forEach(d=>{ const h=document.createElement('div'); h.className='cal-dname'; h.textContent=d; grid.appendChild(h); });
  const first=new Date(yr,mo,1).getDay(), dim=new Date(yr,mo+1,0).getDate(), dimp=new Date(yr,mo,0).getDate();
  for(let i=first-1;i>=0;i--){ const c=document.createElement('div'); c.className='cal-cell other-month'; c.textContent=dimp-i; grid.appendChild(c); }
  for(let d=1;d<=dim;d++){
    const ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const c=document.createElement('div'); c.className='cal-cell';
    if(ds===todayStr()) c.classList.add('today');
    if(ds===selectedDate) c.classList.add('selected');
    const t=tareasDelDia(ds); const dot=t.length?getDotColor(t):null;
    c.innerHTML='<span>'+d+'</span>'+(dot?'<div class="cal-dot" style="background:'+dot+'"></div>':'<div class="cal-dot"></div>');
    c.addEventListener('click',()=>{
      selectedDate=ds;
      const diff=Math.floor((dateFromStr(ds)-new Date())/(24*60*60*1000));
      weekOffset=diff<-1?0:diff>=7?Math.ceil((diff-6)/7):0;
      buildCalendar(); buildWeek(); renderTasks(); updateHeader();
    });
    grid.appendChild(c);
  }
  const rem=(first+dim)%7; for(let d=1;d<=(rem?7-rem:0);d++){ const c=document.createElement('div'); c.className='cal-cell other-month'; c.textContent=d; grid.appendChild(c); }
}

function getDotColor(tareas) {
  if(tareas.some(t=>t.prioridad==='alta')) return PRIO_COLOR.alta;
  if(tareas.some(t=>t.prioridad==='media')) return PRIO_COLOR.media;
  return PRIO_COLOR.baja;
}

// ── Week ──────────────────────────────────────────────────────────────────────
function buildWeek() {
  const nav=document.getElementById('week-nav'); nav.innerHTML='';
  const today=new Date(), base=weekOffset===0?-1:weekOffset*7;
  for(let i=base;i<base+8;i++){
    const d=new Date(today); d.setDate(today.getDate()+i);
    const ds=strFromDate(d);
    const btn=document.createElement('button'); btn.className='day-btn';
    if(ds===todayStr()) btn.classList.add('today');
    if(ds===selectedDate) btn.classList.add('active');
    if(tareasDelDia(ds).length) btn.classList.add('has-tasks');
    const showMes=(i===base)||d.getDate()===1;
    btn.innerHTML='<span class="dname">'+DIAS[d.getDay()]+'</span><span class="dnum">'+d.getDate()+'</span>'+(showMes?'<span class="dmes">'+MESES[d.getMonth()]+'</span>':'');
    btn.addEventListener('click',()=>{ selectedDate=ds; buildCalendar(); buildWeek(); renderTasks(); updateHeader(); });
    nav.appendChild(btn);
  }
  document.getElementById('week-prev').disabled=weekOffset<=0;
}

// ── Render tasks ──────────────────────────────────────────────────────────────
function renderTasks() {
  const tareas=tareasDelDia(selectedDate);
  const sorted=[...tareas].sort((a,b)=>{
    const ta=a.hora?parseInt(a.hora.replace(':','')):9999;
    const tb=b.hora?parseInt(b.hora.replace(':','')):9999;
    return ta-tb;
  });
  document.getElementById('empty').style.display=sorted.length?'none':'block';
  document.getElementById('tasks-section').style.display=sorted.length?'block':'none';
  document.getElementById('tasks-count').textContent=sorted.length+' '+(sorted.length===1?'item':'items');
  const list=document.getElementById('task-list'); list.innerHTML='';
  for(const t of sorted){
    const col=getCardColors(t.tipo,t.prioridad);
    const isRec=!!(t.recurrentDays&&t.recurrentDays.length);
    const isDone=isCompletedOn(t,selectedDate);
    const isSynced=!!(t.gcalEventId&&Object.keys(t.gcalEventId).length>0);
    const card=document.createElement('div');
    card.className='task-card'+(isDone?' done':'');
    const stripe=col.stripe?'border-left:3px solid '+col.stripe+';padding-left:13px;':'';
    card.style.cssText='background:'+col.bg+';border:1px solid '+col.border+';'+stripe;
    const checkBg=isDone?'background:'+col.dot+';':'';
    const tipoLabel=t.tipo||'tarea';
    const calTag=gcalUser?(isSynced?'<span class="cal-tag">✓cal</span>':'<button class="task-btn sync-btn" title="Sync con Calendar">🔄</button>'):'';
    card.innerHTML=
      '<button class="task-check" style="border-color:'+col.dot+';'+checkBg+'">'+(isDone?'✓':'')+'</button>'+
      '<div class="task-info">'+
        '<div class="task-meta">'+
          '<span style="color:'+(col.stripe||col.dot)+';font-size:12px">'+(TIPO_ICON[t.tipo]||'◈')+'</span>'+
          '<span style="font-size:10px;color:'+(col.stripe||col.dot)+';text-transform:uppercase;letter-spacing:1px">'+tipoLabel+'</span>'+
          '<span class="task-hora" style="color:'+col.dot+'">'+(t.hora||'—')+'</span>'+
          '<span class="task-prio">'+t.prioridad+'</span>'+
          (isRec?'<span class="task-recurrent">↻</span>':'')+
        '</div>'+
        '<div class="task-texto">'+t.texto+'</div>'+
      '</div>'+
      '<div class="task-actions">'+calTag+'<button class="task-btn edit-btn">✎</button><button class="task-btn del-btn del">✕</button></div>';

    // Check
    card.querySelector('.task-check').addEventListener('click',async()=>{
      if(isRec){
        const cd={...(t.completedDates||{})}; cd[selectedDate]=!isDone;
        await patchTask(t.id,{completedDates:cd});
      } else { await patchTask(t.id,{completada:!t.completada}); }
    });

    // Sync
    const syncBtn=card.querySelector('.sync-btn');
    if(syncBtn) syncBtn.addEventListener('click',()=>{ reconnectAndSync(t); });

    // Edit
    card.querySelector('.edit-btn').addEventListener('click',()=>openEditModal(t.id));

    // Delete
    card.querySelector('.del-btn').addEventListener('click',e=>{
      e.stopPropagation();
      document.querySelectorAll('.del-menu').forEach(m=>m.remove());
      if(isRec){
        const menu=document.createElement('div'); menu.className='del-menu';
        menu.innerHTML='<button class="solo">Solo este día</button><div class="del-sep"></div><button class="danger todos">Borrar siempre</button>';
        card.querySelector('.task-actions').appendChild(menu);
        menu.querySelector('.solo').addEventListener('click',e=>{ e.stopPropagation(); const sd={...(t.skippedDates||{})}; sd[selectedDate]=true; patchTask(t.id,{skippedDates:sd}); menu.remove(); showToast('Ocultado solo para este día'); });
        menu.querySelector('.todos').addEventListener('click',e=>{ e.stopPropagation(); removeTask(t.id); menu.remove(); });
        setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),10);
      } else { removeTask(t.id); }
    });

    list.appendChild(card);
  }
  updateHeader();
}

// ── Parser ────────────────────────────────────────────────────────────────────
function parsearInput(texto) {
  const t=texto.toLowerCase();
  if(/limpiar|borrar todo|empezar de nuevo/i.test(t)){
    allTareas.filter(x=>x.fecha===selectedDate&&(!x.recurrentDays||!x.recurrentDays.length)).forEach(x=>removeTask(x.id));
    return 'Día limpio. ¿Qué planeás?';
  }
  const remedioMatch=texto.match(/(.+?)\s+cada\s+(\d+)\s*h(?:oras?)?\s+(?:desde\s+(?:las?\s+)?)?(\d{1,2})(?::(\d{2}))?/i);
  if(remedioMatch){
    const nombre=remedioMatch[1].replace(/^(tomar|tomo|hay que tomar)\s+/i,'').trim();
    const cada=parseInt(remedioMatch[2]);
    let h=parseInt(remedioMatch[3]); const m=parseInt(remedioMatch[4]||'0');
    const horaStr=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    const horarios=genHorariosRemedio(horaStr,cada,5);
    horarios.forEach(hor=>saveTask(mkRemedio(nombre,hor.hora,hor.fecha)));
    return '💊 Listo, '+horarios.length+' recordatorios de '+nombre+' cada '+cada+'h.';
  }
  const esCharla=/^(cómo|como|qué|que|cuándo|cuando|hola|buenas|gracias)\b/.test(t)&&!/tengo|reunion|gym|estudiar|entregar|llamar|ir a|hacer|clase|turno/.test(t);
  if(esCharla) return 'Dale, ¿qué actividades querés agregar?';
  const frags=texto.split(/,|\sy\s|\sdespués\s|\sluego\s|;/i).map(s=>s.trim()).filter(s=>s.length>2);
  const nuevas=[]; for(const f of frags){const tt=extraerTarea(f);if(tt)nuevas.push(tt);}
  if(!nuevas.length){const tt=extraerTarea(texto);if(tt)nuevas.push(tt);}
  if(!nuevas.length) return 'Mmm, no entendí. Probá: «reunión a las 10, gym todos los lunes a las 18»';
  nuevas.forEach(tt=>saveTask(tt));
  const rec=nuevas.filter(tt=>tt.recurrentDays&&tt.recurrentDays.length);
  const nor=nuevas.filter(tt=>!tt.recurrentDays||!tt.recurrentDays.length);
  let msg='';
  if(nor.length) msg+='Agregué '+(nor.length===1?'«'+nor[0].texto+'»':nor.length+' tareas')+'. ';
  if(rec.length) msg+='Y '+(rec.length===1?'«'+rec[0].texto+'»':rec.length+' tareas')+' como recurrente'+(rec.length>1?'s':'')+'. ';
  return msg.trim()+' ¿Algo más?';
}

function extraerTarea(frag) {
  const f=frag.trim(); if(f.length<3) return null;
  let recDays=[];
  const todosRe=/todos los (lunes|martes|miércoles|miercoles|jueves|viernes|sábados?|sabados?|domingos?|días|dias)/gi;
  const losRe=/\blos (lunes|martes|miércoles|miercoles|jueves|viernes|sábados?|sabados?|domingos?)\b/gi;
  const recMap={lunes:1,martes:2,'miércoles':3,miercoles:3,jueves:4,viernes:5,'sábado':6,sabado:6,'sábados':6,sabados:6,domingo:0,domingos:0};
  let rm;
  while((rm=todosRe.exec(f.toLowerCase()))!==null){const d=rm[1].replace(/s$/,'');if(d==='día'||d==='dia')recDays=[0,1,2,3,4,5,6];else{const n=recMap[d];if(n!==undefined&&!recDays.includes(n))recDays.push(n);}}
  while((rm=losRe.exec(f.toLowerCase()))!==null){const d=rm[1].replace(/s$/,'');const n=recMap[d];if(n!==undefined&&!recDays.includes(n))recDays.push(n);}
  let hora=null;
  const m1=f.match(/(?:a las?|antes de las?)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
  const m2=f.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm|hs|h)\b/i);
  const match=m1||m2;
  if(match){let h=parseInt(match[1]),min=parseInt(match[2]||'0');const ap=(match[3]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;hora=String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');}
  let texto=f.replace(/todos los \S+/gi,'').replace(/\blos (lunes|martes|miércoles|miercoles|jueves|viernes|sábados?|sabados?|domingos?)\b/gi,'').replace(/(?:a las?|antes de las?)\s*\d{1,2}(?::\d{2})?\s*(?:am|pm)?/gi,'').replace(/\b\d{1,2}(?::\d{2})?\s*(?:am|pm|hs|h)\b/gi,'').replace(/^\s*(?:tengo|debo|hay que|necesito|quiero)\s+/i,'').replace(/\s+/g,' ').trim();
  if(!texto||texto.length<2) return null;
  texto=texto.charAt(0).toUpperCase()+texto.slice(1);
  let prio='media';
  if(/reunion|reunión|entrega|entregar|llamar|llamada|turno|médico|medico|parcial|examen/i.test(f)) prio='alta';
  if(/gym|ejercicio|deporte|caminar|correr|pilates|yoga/i.test(f)) prio='baja';
  let tipo='tarea';
  if(/reunion|reunión|llamada|clase|turno|médico|evento|cumple/i.test(f)) tipo='evento';
  if(/recordar|recordatorio|no olvidar/i.test(f)) tipo='recordatorio';
  let recUntil=null;
  if(recDays.length){const u=new Date();u.setDate(u.getDate()+8*7);recUntil=strFromDate(u);}
  return {id:Math.random().toString(36).slice(2)+Date.now().toString(36),texto,hora,prioridad:prio,tipo,completada:false,completedDates:{},recurrentDays:recDays.length?recDays:null,recurrentUntil:recUntil,fecha:recDays.length?null:selectedDate,skippedDates:{}};
}

// ── Remedios ──────────────────────────────────────────────────────────────────
function genHorariosRemedio(horaInicio,cada,dias){
  const horarios=[],start=new Date();const[h,m]=horaInicio.split(':').map(Number);start.setHours(h,m,0,0);
  const total=Math.ceil(dias*24/cada);
  for(let i=0;i<total;i++){const t=new Date(start.getTime()+i*cada*60*60*1000);if(t>=new Date())horarios.push({fecha:strFromDate(t),hora:String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')});}
  return horarios;
}

function mkRemedio(nombre,hora,fecha){
  return {id:Math.random().toString(36).slice(2)+Date.now().toString(36),texto:'💊 '+nombre,hora,prioridad:'alta',tipo:'recordatorio',completada:false,completedDates:{},recurrentDays:null,recurrentUntil:null,fecha,skippedDates:{},esRemedio:true};
}

function actualizarPreviewRemedio(){
  const nombre=document.getElementById('rem-nombre').value.trim();
  const hora=document.getElementById('rem-hora').value;
  const cada=parseInt(document.getElementById('rem-cada').value);
  const dias=parseInt(document.getElementById('rem-dias').value);
  const prev=document.getElementById('rem-preview');
  if(!nombre||!hora){prev.textContent='Completá los campos para ver los horarios';return;}
  const hs=genHorariosRemedio(hora,cada,dias);
  const lines=hs.slice(0,6).map(h=>DIAS[dateFromStr(h.fecha).getDay()]+' '+dateFromStr(h.fecha).getDate()+' → '+h.hora);
  if(hs.length>6) lines.push('... y '+(hs.length-6)+' tomas más');
  prev.innerHTML=lines.join('<br>');
}

// ── Edit modal ────────────────────────────────────────────────────────────────
function openEditModal(id){
  editingId=id;
  const t=allTareas.find(x=>x.id===id); if(!t) return;
  document.getElementById('edit-texto').value=t.texto;
  document.getElementById('edit-hora').value=t.hora||'';
  document.getElementById('edit-prio').value=t.prioridad;
  document.getElementById('edit-tipo').value=t.tipo;
  document.querySelectorAll('.day-chip').forEach(c=>c.classList.toggle('sel',!!(t.recurrentDays&&t.recurrentDays.includes(parseInt(c.dataset.d)))));
  const hasRec=!!(t.recurrentDays&&t.recurrentDays.length);
  document.getElementById('until-field').style.display=hasRec?'block':'none';
  if(t.recurrentUntil){document.getElementById('edit-until').value='custom';document.getElementById('edit-until-date').value=t.recurrentUntil;document.getElementById('edit-until-date').style.display='block';}
  else{document.getElementById('edit-until').value='8';document.getElementById('edit-until-date').style.display='none';}
  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal(){ document.getElementById('edit-modal').classList.remove('open'); editingId=null; }

async function saveEditModal(){
  const idx=allTareas.findIndex(x=>x.id===editingId); if(idx===-1){closeEditModal();return;}
  const selDays=[...document.querySelectorAll('.day-chip.sel')].map(c=>parseInt(c.dataset.d));
  const horaVal=document.getElementById('edit-hora').value;
  const untilSel=document.getElementById('edit-until').value;
  let recUntil=null;
  if(selDays.length){if(untilSel==='custom'){recUntil=document.getElementById('edit-until-date').value||null;}else{const u=new Date();u.setDate(u.getDate()+parseInt(untilSel)*7);recUntil=strFromDate(u);}}
  const updated={...allTareas[idx],texto:document.getElementById('edit-texto').value.trim()||allTareas[idx].texto,hora:horaVal||null,prioridad:document.getElementById('edit-prio').value,tipo:document.getElementById('edit-tipo').value,recurrentDays:selDays.length?selDays:null,recurrentUntil:recUntil,fecha:selDays.length?null:(allTareas[idx].fecha||selectedDate)};
  await saveTask(updated);
  closeEditModal();
}

// ── Google Calendar ───────────────────────────────────────────────────────────
function initGoogleAuth(){
  if(!window.google){setTimeout(initGoogleAuth,500);return;}
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GCAL_CLIENT_ID, scope:GCAL_SCOPE, prompt:gcalUser?'':'consent',
    callback:async resp=>{
      isRefreshing=false;
      if(resp.error){pendingQueue.forEach(r=>r.reject(resp.error));pendingQueue=[];return;}
      gcalToken=resp.access_token; tokenExpiry=Date.now()+(resp.expires_in-60)*1000;
      if(!gcalUser){
        try{const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+gcalToken}});const u=await r.json();gcalUser=u.email||'Conectado';localStorage.setItem('gcal-user',gcalUser);showToast('✓ Google Calendar conectado');}catch(e){gcalUser='Conectado';}
      }
      updateGCalUI();
      pendingQueue.forEach(r=>r.resolve(gcalToken)); pendingQueue=[];
      // Auto sync unsynced tasks after reconnect
      const unsynced=allTareas.filter(t=>!t.gcalEventId||Object.keys(t.gcalEventId).length===0);
      if(unsynced.length){
        for(const t of unsynced){if(t.fecha>=todayStr()||( t.recurrentDays&&t.recurrentDays.length)){try{await syncToGCal(t,t.fecha||todayStr());}catch(e){}await new Promise(r=>setTimeout(r,200));}}
        renderTasks();
      }
    }
  });
  setInterval(()=>{if(gcalUser&&Date.now()>tokenExpiry-5*60*1000)refreshToken();},60*1000);
  updateGCalUI();
  if(gcalUser) refreshToken();
}

function refreshToken(){if(isRefreshing||!tokenClient)return;isRefreshing=true;tokenClient.requestAccessToken({prompt:''});}

function getToken(){
  return new Promise((res,rej)=>{
    if(gcalToken&&Date.now()<tokenExpiry){res(gcalToken);return;}
    pendingQueue.push({resolve:res,reject:rej});
    if(!isRefreshing)refreshToken();
  });
}

function updateGCalUI(){
  const status=document.getElementById('gcal-status');
  const btn=document.getElementById('gcal-connect');
  const syncBtn=document.getElementById('gcal-sync-all');
  if(gcalUser){
    status.textContent=gcalUser;
    btn.textContent='Desconectar';
    btn.style.background='transparent';btn.style.border='1px solid #ffffff15';btn.style.color='#ffffff40';btn.style.fontSize='10px';
    btn.onclick=disconnectGCal;
    syncBtn.style.display='block';
  } else {
    status.textContent='No conectado';
    btn.textContent='Conectar';
    btn.style.background='linear-gradient(135deg,#4285f4,#34a853)';btn.style.border='none';btn.style.color='#fff';btn.style.fontSize='11px';
    btn.onclick=connectGCal;
    syncBtn.style.display='none';
  }
}

function connectGCal(){if(!tokenClient){initGoogleAuth();setTimeout(connectGCal,800);return;}tokenClient.requestAccessToken({prompt:'consent'});}

function disconnectGCal(){if(gcalToken)google.accounts.oauth2.revoke(gcalToken,()=>{});gcalToken=null;gcalUser=null;tokenExpiry=0;localStorage.removeItem('gcal-user');updateGCalUI();}

async function gcalReq(method,path,body){
  if(!gcalUser) return null;
  let token; try{token=await getToken();}catch(e){return null;}
  const resp=await fetch('https://www.googleapis.com/calendar/v3'+path,{method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(resp.status===401){gcalToken=null;tokenExpiry=0;try{token=await getToken();const r2=await fetch('https://www.googleapis.com/calendar/v3'+path,{method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r2.status===204)return true;return r2.json().catch(()=>null);}catch(e){return null;}}
  if(resp.status===204)return true;
  if(!resp.ok)return null;
  return resp.json().catch(()=>null);
}

async function syncToGCal(tarea,dateStr){
  if(!gcalUser)return;
  const key=dateStr||tarea.fecha||todayStr();
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  let start,end;
  if(tarea.hora){const[h,m]=tarea.hora.split(':');const eh=String(parseInt(h)+1).padStart(2,'0');start={dateTime:key+'T'+h+':'+m+':00',timeZone:tz};end={dateTime:key+'T'+eh+':'+m+':00',timeZone:tz};}
  else{start={date:key};end={date:key};}
  const event={summary:tarea.texto,description:'[Mi Día] tipo:'+tarea.tipo+' prioridad:'+tarea.prioridad,start,end};
  try{
    if(tarea.gcalEventId&&tarea.gcalEventId[key]){
      const r=await gcalReq('PUT','/calendars/primary/events/'+tarea.gcalEventId[key],event);
      if(r)showToast('✓ Actualizado en Google Calendar');
    } else {
      const r=await gcalReq('POST','/calendars/primary/events',event);
      if(r&&r.id){const gid={...(tarea.gcalEventId||{}),[key]:r.id};await patchTask(tarea.id,{gcalEventId:gid});showToast('✓ Agregado a Google Calendar');renderTasks();}
      else showToast('🔄 No se pudo sync — tocá 🔄 para reintentar','err');
    }
  }catch(e){showToast('🔄 Tocá 🔄 para reintentar','err');}
}

function reconnectAndSync(tarea){
  if(!tokenClient){showToast('Reconectá Google Calendar primero','err');return;}
  showToast('Reconectando...');
  gcalToken=null;tokenExpiry=0;
  // Store tarea to sync after reconnect
  const origCb=tokenClient._cb;
  tokenClient.requestAccessToken({prompt:''});
  // Will auto-sync in the callback's unsynced loop
}

async function syncAllToGCal(){
  if(!gcalUser){showToast('Primero conectá Google Calendar','err');return;}
  const btn=document.getElementById('gcal-sync-all');
  btn.textContent='Sincronizando...';btn.disabled=true;
  let ok=0,skip=0;
  for(const t of allTareas){
    if(t.recurrentDays&&t.recurrentDays.length){
      const today=new Date();
      for(let w=0;w<4;w++){for(const dow of t.recurrentDays){const d=new Date(today);d.setDate(today.getDate()+((dow-today.getDay()+7)%7)+w*7);const ds=strFromDate(d);if(ds>=todayStr()){if(t.gcalEventId&&t.gcalEventId[ds]){skip++;continue;}try{await syncToGCal(t,ds);ok++;}catch(e){}await new Promise(r=>setTimeout(r,200));}}}
    } else if(t.fecha&&t.fecha>=todayStr()){
      if(t.gcalEventId&&t.gcalEventId[t.fecha]){skip++;continue;}
      try{await syncToGCal(t,t.fecha);ok++;}catch(e){}
      await new Promise(r=>setTimeout(r,200));
    }
  }
  btn.textContent='Sincronizar todo';btn.disabled=false;
  showToast(ok===0&&skip>0?'✓ Todo ya sincronizado':'✓ '+ok+' nuevos'+(skip?' ('+skip+' ya existían)':''));
}
